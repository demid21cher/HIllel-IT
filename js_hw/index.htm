<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Image Slider</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 20px;
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        text-align: center;
      }

      .movies-list {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        padding: 20px;
      }

      .movie {
        width: 200px;
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
      }

      .movie img {
        width: 100%; /* Робить зображення адаптивним до ширини картки */
        height: auto;
      }
    </style>
  </head>
  <body>
    <div>
      <form name="search-form">
        <input type="text" name="query" placeholder="Input movie" required />
        <button>Search</button>
      </form>
    </div>
    <div class="movies-list"></div>

    <script src="main_13.js"></script>
  </body>
</html>
