services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      MONGODB_URI: mongodb://mongo:27017/hillelIT
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules

  mongo:
    image: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: hillelIT
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
